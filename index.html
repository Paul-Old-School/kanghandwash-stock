<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KanghanDWash Stock Check</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #eef5ff;
      color: #172033;
    }

    .container {
      max-width: 520px;
      margin: auto;
      background: white;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.12);
    }

    h1 {
      margin-top: 0;
      color: #0759b8;
      text-align: center;
    }

    .note {
      padding: 12px;
      background: #fff4cc;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .test-mode {
      display: block;
      margin-top: 8px;
      color: #9a3412;
      font-weight: bold;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 6px;
      font-size: 20px;
      border: 2px solid #c9d4e6;
      border-radius: 10px;
    }

    .row {
      display: grid;
      grid-template-columns: 70px 1fr;
      align-items: center;
      gap: 12px;
    }

    .row label {
      margin-top: 8px;
      font-size: 20px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 22px;
      border: 0;
      border-radius: 12px;
      background: #06a85c;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: .65;
    }

    #result {
      display: none;
      margin-top: 18px;
      padding: 14px;
      background: #e7f8ee;
      border-radius: 10px;
      white-space: pre-line;
    }
    .employee {
  margin-bottom: 18px;
  padding: 14px;
  background: #e8f3ff;
  border-radius: 10px;
}

#lineStatus {
  margin-top: 5px;
  color: #168347;
  font-size: 14px;
}
  </style>
  <script charset="utf-8"
    src="https://static.line-scdn.net/liff/edge/2/sdk.js">
  </script>
</head>

<body>
  <main class="container">
    <h1>Stock Check</h1>

    <div class="note">
      Take 1 photo before refill.<br>
      Enter empty slots from 0 to 22.
      <span class="test-mode">TEST MODE — No stock deduction.</span>
    </div>
    <div class="employee">
  <strong>Employee:</strong>
  <span id="employeeName">Connecting to LINE...</span>
  <div id="lineStatus"></div>
    </div>
    <form id="stockForm">
      <label for="machine">Machine</label>
      <input
        id="machine"
        name="machine"
        value="M1"
        pattern="M[0-9]+"
        required
      >

      <h2>Empty Slots</h2>

      <div class="row">
        <label for="A1">A1</label>
        <input id="A1" name="A1" type="number" min="0" max="22" required>
      </div>

      <div class="row">
        <label for="A2">A2</label>
        <input id="A2" name="A2" type="number" min="0" max="22" required>
      </div>

      <div class="row">
        <label for="A3">A3</label>
        <input id="A3" name="A3" type="number" min="0" max="22" required>
      </div>

      <div class="row">
        <label for="A4">A4</label>
        <input id="A4" name="A4" type="number" min="0" max="22" required>
      </div>

      <div class="row">
        <label for="A5">A5</label>
        <input id="A5" name="A5" type="number" min="0" max="22" required>
      </div>

      <label for="photo">Photo Before Refill</label>
      <input
        id="photo"
        name="photo"
        type="file"
        accept="image/*"
        capture="environment"
        required
      >

      <button type="submit">CHECK DATA</button>
    </form>

    <div id="result"></div>
  </main>

 <script>
  const LIFF_ID = "2008874119-h7n9QcwL";
  const LIFF_ENDPOINT_URL =
    "https://paul-old-school.github.io/kanghandwash-stock/";
  const TEST_WEBHOOK_URL =
    "https://schoolold.app.n8n.cloud/webhook-test/kanghandwash-stock-intake";
  const TOKEN_REFRESH_BUFFER_MS = 60 * 1000;
  let lineProfile = null;

  function ensureFreshLineIdToken() {
    const employeeName = document.getElementById("employeeName");
    const lineStatus = document.getElementById("lineStatus");
    const submitButton = document.querySelector(
      '#stockForm button[type="submit"]'
    );

    let decodedToken = null;
    try {
      decodedToken = liff.getDecodedIDToken();
    } catch (error) {
      console.error("Unable to decode LINE ID Token.", error);
    }

    const expiresAt = Number(decodedToken && decodedToken.exp) * 1000;
    const tokenIsFresh =
      Number.isFinite(expiresAt) &&
      expiresAt > Date.now() + TOKEN_REFRESH_BUFFER_MS;

    if (tokenIsFresh) {
      return true;
    }

    lineProfile = null;
    submitButton.disabled = true;
    employeeName.textContent = "LINE session expired";

    if (liff.isInClient()) {
      lineStatus.textContent =
        "Close this page and reopen it from LINE to sign in again.";
      return false;
    }

    lineStatus.textContent = "Signing in to LINE again...";

    try {
      liff.logout();
      liff.login({ redirectUri: LIFF_ENDPOINT_URL });
    } catch (error) {
      console.error("Unable to refresh LINE login.", error);
      lineStatus.textContent =
        "Unable to refresh LINE login. Close this page and open the LIFF link again.";
    }

    return false;
  }

  async function initializeLiff() {
    const employeeName = document.getElementById("employeeName");
    const lineStatus = document.getElementById("lineStatus");

    try {
      await liff.init({
        liffId: LIFF_ID,
        withLoginOnExternalBrowser: true
      });

      if (!liff.isLoggedIn()) {
        liff.login({ redirectUri: LIFF_ENDPOINT_URL });
        return;
      }

      if (!ensureFreshLineIdToken()) {
        return;
      }

      lineProfile = await liff.getProfile();

      employeeName.textContent = lineProfile.displayName;
      lineStatus.textContent = "LINE connected";

    } catch (error) {
      console.error(error);

      employeeName.textContent = "Connection failed";
      lineStatus.textContent =
        (error.code || "LIFF_ERROR") + ": " +
        (error.message || "Unable to connect");
    }
  }

  document
    .getElementById("stockForm")
    .addEventListener("submit", async function(event) {
      event.preventDefault();

      if (!lineProfile) {
        alert("Please wait for LINE connection.");
        return;
      }

      if (!ensureFreshLineIdToken()) {
        return;
      }

      const machine =
        document.getElementById("machine").value.toUpperCase();

      const shelves = ["A1", "A2", "A3", "A4", "A5"];
      let total = 0;
      let details = "";
      const formData = new FormData();

      formData.append("machine", machine);

      shelves.forEach(function(shelf) {
        const amount =
          Number(document.getElementById(shelf).value);

        total += amount;
        details += shelf + ": " + amount + "\n";
        formData.append(shelf, String(amount));
      });

      const result = document.getElementById("result");
      const submitButton = event.currentTarget.querySelector(
        'button[type="submit"]'
      );
      const photoFile = document.getElementById("photo").files[0];
      const idToken = liff.getIDToken();

      if (!idToken) {
        alert("LINE login token is unavailable. Please reopen this page from LINE.");
        return;
      }

      if (!photoFile) {
        alert("Please take 1 photo before refill.");
        return;
      }

      formData.append("idToken", idToken);
      formData.append("photo", photoFile, photoFile.name);

      result.style.display = "block";
      result.style.background = "#e7f8ee";
      result.textContent =
        "Employee: " + lineProfile.displayName + "\n" +
        "Machine: " + machine + "\n\n" +
        details +
        "\nTotal refill: " + total + " sachets\n\n" +
        "Sending test data to n8n...";

      submitButton.disabled = true;
      submitButton.textContent = "SENDING...";

      try {
        const response = await fetch(TEST_WEBHOOK_URL, {
          method: "POST",
          body: formData
        });

        const responseText = await response.text();
        let responseData = {};
        try {
          responseData = responseText ? JSON.parse(responseText) : {};
        } catch (parseError) {
          responseData = { message: responseText };
        }

        if (!response.ok) {
          throw new Error(
            responseData.message ||
            "n8n returned HTTP " + response.status
          );
        }

        if (responseData.success !== true || !responseData.recordId) {
          throw new Error(
            responseData.message ||
            "n8n did not complete the workflow. Check the latest execution."
          );
        }

        result.style.background = "#e7f8ee";
        result.textContent =
          "Employee: " + lineProfile.displayName + "\n" +
          "Machine: " + machine + "\n\n" +
          details +
          "\nTotal refill: " + total + " sachets\n\n" +
          "Test saved: " + responseData.recordId + "\n" +
          "No stock was deducted.";
      } catch (error) {
        console.error(error);
        result.style.background = "#fee2e2";
        result.textContent =
          "Send failed: " + (error.message || "Unknown error") + "\n\n" +
          "Open n8n Executions to check which node stopped. " +
          "For test mode, the Webhook must also be listening.";
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "CHECK DATA";
      }
    });

  initializeLiff();
</script>
</body>
</html>
